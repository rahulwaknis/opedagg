name: Hourly RSS Refresh

on:
  schedule:
    # Run every 6 hours at minute 0
    - cron: '0 */6 * * *'
  # Also allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger RSS refresh on Render
        run: |
          set -e
          if [ -z "$RENDER_APP_URL" ]; then
            echo "ERROR: RENDER_APP_URL is not set. Add it to repo secrets."
            exit 1
          fi
          if [[ "$RENDER_APP_URL" != http*://* ]]; then
            echo "ERROR: RENDER_APP_URL must be a full URL like https://your-app.onrender.com"
            exit 1
          fi
          curl -X POST \
            -H "Content-Type: application/json" \
            "$RENDER_APP_URL/api/refresh" \
            -d '{}'
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
